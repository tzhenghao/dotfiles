# Set default shell to the local configured shell.
set -g default-shell $SHELL

# Automatically rename tmux window to current working directory.
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Copy-paste integration (MacOS) — native pbcopy/pbpaste, no wrapper needed
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Enable mouse mode
set -g mouse on
setw -g mode-keys vi

# Copy mode line numbers (relative, vi-style)
setw -g copy-mode-line-numbers relative

# Set escape keypress delay to 0 (no delay, good for vim/neovim)
set -sg escape-time 0

# Larger scrollback buffer
set -g history-limit 10000

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# True color / terminal support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Visual indicator when prefix key is active
set -g status-left '#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}'

# Split panes in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf
